[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcptop"
version = "1.0.0"
description = "htop for local MCP servers — config-aware, read-only process diagnostics"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "kingstar" }
]
keywords = ["mcp", "codex", "claude-code", "cursor", "opencode", "diagnostics"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Monitoring",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/zcxikingstar-ship-it/mcptop"
Issues = "https://github.com/zcxikingstar-ship-it/mcptop/issues"

[project.scripts]
mcptop = "mcptop.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
